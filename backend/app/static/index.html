<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akıllı Kampüs – Duraklarım</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#667085;--accent:#1d4ed8;--line:#e4e7ec;--warn:#b42318;--ok:#067647;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1317;--card:#171c22;--text:#e6e8eb;--muted:#9aa4af;--accent:#7aa2ff;--line:#2a313a;--warn:#ff8b7b;--ok:#5dd39e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--warn);border:1px solid var(--line);padding:4px 10px}
form{display:grid;gap:8px}
.muted{color:var(--muted);font-size:.9rem}
.err{color:var(--warn);font-size:.9rem;min-height:1.2em}
.bus{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.bus:first-child{border-top:0}
.badge{font-weight:600;white-space:nowrap}
.badge.now{color:var(--ok)}
.hidden{display:none}
.notif{padding:6px 0;border-top:1px solid var(--line)}
.notif:first-child{border-top:0}
h2{font-size:1rem;margin:0 0 8px}
</style>
</head>
<body>
<main>
  <h1>Akıllı Kampüs – Duraklarım</h1>

  <section id="login" class="card hidden">
    <form id="loginForm">
      <input id="email" type="email" placeholder="E-posta" autocomplete="username" required>
      <input id="password" type="password" placeholder="Şifre" autocomplete="current-password" required>
      <button type="submit">Giriş yap</button>
      <div class="err" id="loginErr"></div>
    </form>
  </section>

  <section id="app" class="hidden">
    <div class="row" style="margin-bottom:12px">
      <span class="muted" id="who"></span>
      <button class="ghost" id="logout">Çıkış</button>
    </div>

    <div class="card">
      <form id="addForm">
        <input id="no" inputmode="numeric" placeholder="Durak numarası (örn. 12579)" required>
        <input id="ad" placeholder="Durağa bir ad ver (örn. Ev durağı)">
        <button type="submit">Durak ekle</button>
        <div class="err" id="addErr"></div>
      </form>
    </div>

    <div id="stops"></div>
    <p class="muted" id="empty">Henüz durak eklemedin.</p>

    <div class="card">
      <h2>Son bildirimler</h2>
      <div id="notifs" class="muted">Henüz bildirim yok.</div>
    </div>
  </section>

  <p class="err" id="fatal"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const MAX_STOPS = 10;       // veritabanındaki sınırla aynı olmalı
const REFRESH_MS = 30000;   // sunucu önbelleği 30 sn
let sb = null, currentUser = undefined, stops = [], timer = null;  // undefined = henüz bilinmiyor
const $ = (id) => document.getElementById(id);

// Backend'e giriş token'ıyla istek at
async function api(path) {
  const { data } = await sb.auth.getSession();
  const token = data.session ? data.session.access_token : '';
  return fetch(path, { headers: { Authorization: 'Bearer ' + token } });
}

function el(tag, props = {}, ...children) {
  const n = document.createElement(tag);
  Object.assign(n, props);
  for (const c of children) n.append(c);
  return n;
}

async function init() {
  let cfg;
  try { cfg = await (await fetch('/config')).json(); } catch { cfg = {}; }
  if (!cfg.supabase_url || !cfg.supabase_anon_key) {
    $('fatal').textContent = 'Supabase ayarı yok: backend/.env dosyasına SUPABASE_URL ve SUPABASE_ANON_KEY yaz.';
    return;
  }
  sb = supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
  const { data } = await sb.auth.getSession();
  setUser(data.session ? data.session.user : null);
  sb.auth.onAuthStateChange((_e, s) => setUser(s ? s.user : null));
}

function setUser(user) {
  const yeniId = user ? user.id : null;
  const eskiId = currentUser === undefined ? undefined : (currentUser ? currentUser.id : null);
  if (yeniId === eskiId) return;
  currentUser = user;
  $('login').classList.toggle('hidden', !!user);
  $('app').classList.toggle('hidden', !user);
  clearInterval(timer);
  if (user) {
    $('who').textContent = user.email;
    loadStops();
    timer = setInterval(() => { if (!document.hidden) refreshAll(); }, REFRESH_MS);
  } else {
    stops = []; $('stops').replaceChildren();
  }
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) $('loginErr').textContent = 'Giriş başarısız: ' + error.message;
});
$('logout').addEventListener('click', () => sb.auth.signOut());

async function loadStops() {
  const { data, error } = await sb.from('favorite_stops').select('id,durak_no,ad').order('created_at');
  if (error) { $('addErr').textContent = 'Duraklar okunamadı: ' + error.message; return; }
  stops = data;
  render();
  loadNotifications();
}

async function loadNotifications() {
  const { data, error } = await sb.from('notifications')
    .select('mesaj,created_at').order('created_at', { ascending: false }).limit(5);
  const box = $('notifs');
  if (error) {
    console.error('notifications hatası:', error);
    box.className = 'err';
    box.textContent = 'Bildirimler okunamadı: ' + error.message;
    return;
  }
  if (!data || data.length === 0) { box.className = 'muted'; box.textContent = 'Henüz bildirim yok.'; return; }
  box.className = '';
  box.replaceChildren(...data.map((n) => el('div', { className: 'notif' },
    el('div', { textContent: n.mesaj }),
    el('div', { className: 'muted', textContent: new Date(n.created_at).toLocaleString('tr-TR') }))));
}

function render() {
  const box = $('stops');
  box.replaceChildren();
  $('empty').classList.toggle('hidden', stops.length > 0);
  for (const s of stops) {
    const body = el('div', { className: 'muted' }, 'Yükleniyor…');
    const del = el('button', { className: 'danger', textContent: 'Sil' });
    del.addEventListener('click', () => removeStop(s.id));
    const head = el('div', { className: 'row' },
      el('div', {}, el('strong', { textContent: s.ad }), el('div', { className: 'muted', textContent: 'Durak ' + s.durak_no })),
      del);
    const card = el('div', { className: 'card' }, head, el('div', { style: 'height:8px' }), body);
    s.body = body;
    box.append(card);
  }
  refreshAll();
}

function refreshAll() { stops.forEach(refreshStop); if (currentUser) loadNotifications(); }

async function refreshStop(s) {
  let data;
  try {
    const r = await api('/stops/' + encodeURIComponent(s.durak_no) + '/arrivals');
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch {
    s.body.replaceChildren('Canlı veri alınamadı, resmi tarifeye bakınız.');
    return;
  }
  const out = [];
  if (data.canli.length === 0) {
    out.push(el('div', { className: 'muted', textContent: data.bos
      ? 'Şu an araç görünmüyor (numara geçersiz de olabilir).'
      : 'Şu an canlı araç yok.' }));
  }
  for (const c of data.canli.slice(0, 6)) {
    const text = c.geliyor ? 'Geliyor' : (c.dakika === null ? c.sure_ham : c.dakika + ' dk');
    out.push(el('div', { className: 'bus' },
      el('span', { textContent: c.hat_no + ' · ' + c.hat_ad }),
      el('span', { className: 'badge' + (c.geliyor ? ' now' : ''), textContent: text })));
  }
  if (data.stale) out.push(el('div', { className: 'muted', textContent: 'Veri güncel olmayabilir (EGO yanıt vermedi).' }));
  s.body.replaceChildren(...out);
}

$('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('addErr'); err.textContent = '';
  const no = $('no').value.trim();
  const ad = $('ad').value.trim() || ('Durak ' + no);
  if (!/^\d{1,7}$/.test(no)) { err.textContent = 'Durak numarası yalnızca rakam olmalı.'; return; }
  if (stops.length >= MAX_STOPS) { err.textContent = 'En fazla ' + MAX_STOPS + ' durak ekleyebilirsin.'; return; }
  try {
    const r = await api('/stops/' + no + '/arrivals');
    if (r.ok && (await r.json()).bos &&
        !confirm('Bu numarada şu an araç görünmüyor ya da numara geçersiz olabilir. Yine de eklensin mi?')) return;
  } catch { /* doğrulama yapılamadıysa eklemeye izin ver */ }
  const { error } = await sb.from('favorite_stops').insert({ user_id: currentUser.id, durak_no: no, ad });
  if (error) { err.textContent = error.code === '23505' ? 'Bu durak zaten ekli.' : error.message; return; }
  $('no').value = ''; $('ad').value = '';
  loadStops();
});

async function removeStop(id) {
  const { error } = await sb.from('favorite_stops').delete().eq('id', id);
  if (error) { $('addErr').textContent = error.message; return; }
  loadStops();
}

init();
</script>
</body>
</html>
